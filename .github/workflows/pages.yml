# 서버 없는 미리보기판(HWP → PDF 변환 · 내려받기)을 GitHub Pages(gh-pages 브랜치)로 올립니다.
# 주소: https://osense.github.io/Sensse_Drop/
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm --prefix web run build:pages
      - run: rm -f web/out/vendor/rhwp_bg.wasm.gz
      - name: gh-pages 브랜치로 올리기
        working-directory: web/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
