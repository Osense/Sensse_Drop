# main 에 푸시하면 화면을 빌드해 Cloudflare Workers 로 배포합니다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_SECRET_KEY
# 권장: FILE_KEY_SECRET (종단간 암호화 pepper. 한 번 정하면 바꾸지 마세요. 바꾸면 그 뒤 만든 링크만 새 값을 써요)
# (Secrets 가 아직 없으면 빌드 · 타입 검사만 하고 배포는 건너뜁니다)
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_FKS: ${{ secrets.FILE_KEY_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm run build

      - name: Create R2 bucket (first deploy only)
        if: github.event_name != 'pull_request' && env.HAS_CF == 'true'
        run: npx wrangler r2 bucket create sense-drop-files || echo "bucket already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_SECRET_KEY
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Set FILE_KEY_SECRET (있을 때만)
        if: github.event_name != 'pull_request' && env.HAS_CF == 'true' && env.HAS_FKS == 'true'
        run: printf '%s' "$FILE_KEY_SECRET" | npx wrangler secret put FILE_KEY_SECRET
        env:
          FILE_KEY_SECRET: ${{ secrets.FILE_KEY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped
        if: github.event_name != 'pull_request' && env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secrets 가 없어 배포를 건너뛰었습니다."
